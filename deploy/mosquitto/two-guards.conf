# Mosquitto untuk Two-Guards: broker dibuka ke jaringan lokal supaya ESP32
# bisa konek lewat WiFi, dengan autentikasi dan ACL.
#
# Dipasang sebagai /etc/mosquitto/conf.d/two-guards.conf, dimuat lewat
# "include_dir /etc/mosquitto/conf.d" di akhir /etc/mosquitto/mosquitto.conf.
# Langkah lengkapnya: deploy/mosquitto/README.md.

# Semua antarmuka, termasuk localhost (dipakai server Laravel di mesin yang
# sama). Batasi aksesnya ke jaringan lokal lewat firewall.
listener 1883 0.0.0.0

# Tanpa akun tidak bisa konek sama sekali.
allow_anonymous false

# Dibuat dengan mosquitto_passwd; tidak pernah masuk git.
password_file /etc/mosquitto/two-guards/passwd

# Siapa boleh publish/subscribe ke topic mana. Lihat berkas acl di folder ini.
acl_file /etc/mosquitto/two-guards/acl
